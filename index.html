<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empowering Digital Families</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --forest:#1c3a2e; --forest-light:#2a5040;
  --cream:#f4efe6; --warm:#faf8f4;
  --amber:#c4873a; --amber-l:#e8a857;
  --dark:#1a1a18; --mid:#4a4a42; --light:#7a7a70;
  --rule:#d8d2c4;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--warm);color:var(--dark);line-height:1.6;overflow-x:hidden}

/* NAV */
nav{position:sticky;top:0;width:100%;z-index:100;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.75rem;padding:1rem 3rem;background:rgba(244,239,230,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.nav-logo{display:flex;align-items:center;text-decoration:none}
.nav-logo svg{height:42px;width:auto}
.nav-right{display:flex;align-items:center;gap:2rem;flex-wrap:wrap}
.nav-links{display:flex;gap:1.5rem;list-style:none;flex-wrap:wrap}
.nav-links a{font-size:.75rem;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--mid);text-decoration:none;transition:color .2s}
.nav-links a:hover{color:var(--forest)}
.lang-btn{font-size:.72rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;background:none;border:1px solid var(--amber);color:var(--amber);padding:.3rem .75rem;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .2s,color .2s}
.lang-btn:hover{background:var(--amber);color:#fff}

/* HERO */
.hero{display:grid;grid-template-columns:1fr 1fr;background:var(--forest);min-height:90vh;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-20%;right:-10%;width:60%;height:120%;background:radial-gradient(ellipse,rgba(196,135,58,.12) 0%,transparent 70%);pointer-events:none}
.hero-text{display:flex;flex-direction:column;justify-content:center;padding:5rem 4rem;position:relative;z-index:2}
.eyebrow{font-size:.7rem;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--amber);margin-bottom:1.5rem}
.hero h1{font-family:'Fraunces',serif;font-size:clamp(2.4rem,4vw,3.8rem);font-weight:300;line-height:1.1;color:var(--cream);letter-spacing:-.03em;margin-bottom:1.5rem}
.hero h1 em{font-style:italic;color:var(--amber-l)}
.hero-body{font-size:1rem;font-weight:300;color:rgba(244,239,230,.72);max-width:460px;line-height:1.75;margin-bottom:2.5rem}
.hero-cta{display:inline-flex;align-items:center;gap:.5rem;font-size:.85rem;font-weight:500;color:var(--cream);background:none;border:none;border-bottom:1px solid var(--amber);padding-bottom:.2rem;cursor:pointer;font-family:'DM Sans',sans-serif;width:fit-content}
.hero-visual{display:flex;align-items:center;justify-content:center;padding:3rem}
.diagram{position:relative;width:300px;height:300px}
.ring{position:absolute;border-radius:50%;border:1px solid rgba(196,135,58,.3);top:50%;left:50%;transform:translate(-50%,-50%)}
.r1{width:300px;height:300px;animation:rot 40s linear infinite}
.r2{width:200px;height:200px;animation:rot 28s linear infinite reverse}
.r3{width:110px;height:110px;border-color:rgba(196,135,58,.5)}
@keyframes rot{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}
.diagram-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;font-family:'Fraunces',serif;font-size:.8rem;font-style:italic;color:rgba(244,239,230,.45);line-height:1.5}

/* SECTIONS */
hr.rule{border:none;border-top:1px solid var(--rule)}
section{padding:5.5rem 4rem}
.sec-eyebrow{font-size:.7rem;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--amber);margin-bottom:.8rem}
.sec-title{font-family:'Fraunces',serif;font-size:clamp(1.8rem,2.8vw,2.6rem);font-weight:300;letter-spacing:-.03em;line-height:1.2;color:var(--forest);margin-bottom:1.25rem}
.sec-title em{font-style:italic}
.sec-body{font-size:.95rem;font-weight:300;color:var(--mid);max-width:580px;line-height:1.8}

/* PREMISA */
#premisa{background:var(--cream);display:grid;grid-template-columns:1fr 1fr;gap:5rem;align-items:center}
.premisa-quote{font-family:'Fraunces',serif;font-size:clamp(1.3rem,2vw,1.9rem);font-weight:300;font-style:italic;line-height:1.45;color:var(--forest);border-left:3px solid var(--amber);padding-left:1.75rem}
.premisa-quote sup a{color:var(--amber);text-decoration:none;font-size:.65em}
.p-item{display:flex;gap:1.25rem;padding:1.25rem 0;border-bottom:1px solid var(--rule)}
.p-item:first-of-type{border-top:1px solid var(--rule)}
.p-num{font-family:'Fraunces',serif;font-size:1.6rem;font-weight:300;color:rgba(196,135,58,.4);line-height:1;min-width:2.2rem;padding-top:.1rem}
.p-item strong{display:block;font-size:.88rem;font-weight:500;color:var(--forest);margin-bottom:.25rem}
.p-item p{font-size:.88rem;font-weight:300;color:var(--mid);line-height:1.65}

/* TEMAS */
#temas{background:var(--warm)}
.temas-header{display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:end;margin-bottom:3.5rem}
.temas-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule)}
.tema-card{background:var(--warm);padding:2.25rem 1.75rem;transition:background .3s}
.tema-card:hover{background:var(--cream)}
.tema-icon{font-size:1.4rem;margin-bottom:1rem;display:block}
.tema-card h3{font-family:'Fraunces',serif;font-size:1.05rem;font-weight:400;color:var(--forest);line-height:1.3;margin-bottom:.6rem}
.tema-card p{font-size:.85rem;font-weight:300;color:var(--mid);line-height:1.7}
.tema-card p sup a{color:var(--amber);text-decoration:none;font-size:.75em}
.tema-tag{display:inline-block;margin-top:1rem;font-size:.7rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}

/* CIEGOS */
#ciegos{background:var(--forest);color:var(--cream)}
#ciegos .sec-title{color:var(--cream)}
.ciegos-grid{display:grid;grid-template-columns:1fr 1fr;gap:4rem;margin-top:3.5rem}
.ciego-col h3{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:300;font-style:italic;color:var(--amber-l);margin-bottom:1.75rem;padding-bottom:.9rem;border-bottom:1px solid rgba(244,239,230,.15)}
.ciego-item{display:flex;gap:1rem;padding:.9rem 0;border-bottom:1px solid rgba(244,239,230,.1)}
.ciego-dot{width:6px;height:6px;background:var(--amber);border-radius:50%;margin-top:.55rem;flex-shrink:0}
.ciego-item p{font-size:.87rem;font-weight:300;color:rgba(244,239,230,.75);line-height:1.65}
.ciego-item p sup a{color:var(--amber-l);text-decoration:none;font-size:.75em}

/* CONVERSACIONES */
#conversaciones{background:var(--cream)}
.conv-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.5rem;margin-top:3rem}
.conv-card{background:var(--warm);padding:1.75rem;border-left:3px solid transparent;transition:border-color .3s}
.conv-card:hover{border-color:var(--amber)}
.conv-card h3{font-family:'Fraunces',serif;font-size:1rem;font-weight:400;color:var(--forest);margin-bottom:.6rem}
.conv-card p{font-size:.85rem;font-weight:300;color:var(--mid);line-height:1.7}

/* COMUNIDAD */
#comunidad{background:var(--warm);text-align:center}
.comunidad-inner{max-width:700px;margin:0 auto}
.placeholder{margin-top:3.5rem;border:2px dashed var(--rule);padding:4rem 2.5rem;position:relative}
.ph-label{position:absolute;top:-.7rem;left:50%;transform:translateX(-50%);background:var(--warm);padding:0 1rem;font-size:.7rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--light);white-space:nowrap}
.placeholder h3{font-family:'Fraunces',serif;font-size:1.3rem;font-weight:300;font-style:italic;color:var(--light);margin-bottom:.9rem}
.placeholder p{font-size:.86rem;color:var(--light);font-weight:300;line-height:1.7;max-width:460px;margin:0 auto}
.ph-tags{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:1.75rem}
.ph-tag{font-size:.75rem;color:var(--light);border:1px solid var(--rule);padding:.35rem .9rem;border-radius:2rem}

/* REFERENCIAS */
#referencias{background:var(--cream);padding:5rem 4rem}
#referencias h2{font-family:'Fraunces',serif;font-size:1.35rem;font-weight:300;color:var(--forest);margin-bottom:2.25rem;padding-bottom:.9rem;border-bottom:1px solid var(--rule)}
.ref-list{list-style:none;display:flex;flex-direction:column;gap:1rem}
.ref-list li{display:grid;grid-template-columns:1.4rem 1fr;gap:.75rem;font-size:.82rem;font-weight:300;color:var(--mid);line-height:1.65}
.ref-num{font-family:'Fraunces',serif;font-weight:400;color:var(--amber)}
.ref-list a{color:var(--forest);word-break:break-all}

/* FOOTER */
footer{background:var(--dark);padding:2.5rem 4rem;display:flex;justify-content:space-between;align-items:center}
.footer-logo{font-family:'Fraunces',serif;font-size:1rem;color:rgba(244,239,230,.45)}
.footer-note{font-size:.75rem;color:rgba(244,239,230,.25);font-weight:300}

/* FADE */
.fade{opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .7s ease}
.fade.visible{opacity:1;transform:translateY(0)}

/* RESPONSIVE */
@media(max-width:800px){
  nav{padding:1rem 1.5rem}
  .hero{grid-template-columns:1fr}
  .hero-visual{display:none}
  .hero-text{padding:4rem 1.5rem}
  section{padding:4rem 1.5rem}
  #premisa{grid-template-columns:1fr;gap:2.5rem}
  .temas-header{grid-template-columns:1fr}
  .temas-grid{grid-template-columns:1fr}
  .ciegos-grid{grid-template-columns:1fr;gap:2rem}
  .conv-grid{grid-template-columns:1fr}
  footer{flex-direction:column;gap:.75rem;padding:2rem 1.5rem}
  #referencias{padding:4rem 1.5rem}
}
</style>
</head>

let lang = 'es';

function navTo(id){ document.getElementById(id)?.scrollIntoView({behavior:'smooth'}); }

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;

  // Nav
  const nl = document.getElementById('nav-links');
  nl.innerHTML = t.nav.map(([id,label])=>`<li><a href="#" onclick="event.preventDefault();navTo('${id}')">${label}</a></li>`).join('');
  document.getElementById('lang-btn').textContent = t.langBtn;

  // Data-key elements
  document.querySelectorAll('[data-key]').forEach(el=>{
    const k = el.dataset.key;
    if(t[k] !== undefined) el.innerHTML = t[k];
  });

  // Premisa items
  document.getElementById('premisa-items').innerHTML = t.premisaItems.map(([n,title,desc])=>
    `<div class="p-item"><span class="p-num">${n}</span><div><strong>${title}</strong><p>${desc}</p></div></div>`
  ).join('');

  // Temas grid
  document.getElementById('temas-grid').innerHTML = t.temas.map(([icon,title,body,tag])=>
    `<div class="tema-card fade"><span class="tema-icon">${icon}</span><h3>${title}</h3><p>${body}</p><span class="tema-tag">${tag}</span></div>`
  ).join('');

  // Ciegos
  document.getElementById('adultos-items').innerHTML = t.adultosItems.map(item=>
    `<div class="ciego-item"><div class="ciego-dot"></div><p>${item}</p></div>`
  ).join('');
  document.getElementById('adolescentes-items').innerHTML = t.adolescentesItems.map(item=>
    `<div class="ciego-item"><div class="ciego-dot"></div><p>${item}</p></div>`
  ).join('');

  // Conv cards
  document.getElementById('conv-grid').innerHTML = t.convCards.map(([title,desc])=>
    `<div class="conv-card"><h3>${title}</h3><p>${desc}</p></div>`
  ).join('');

  // Placeholder tags
  document.getElementById('ph-tags').innerHTML = t.phTags.map(tag=>
    `<span class="ph-tag">${tag}</span>`
  ).join('');

  // References
  document.getElementById('ref-list').innerHTML = t.refs.map(r=>
    `<li><span class="ref-num" id="${r.id}">${r.n}</span><span>${r.html}</span></li>`
  ).join('');

  // Re-observe fades
  observeFades();
}

function toggleLang(){ lang = lang==='es'?'en':'es'; render(); }

function observeFades(){
  const obs = new IntersectionObserver(entries=>{
    entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('visible'); });
  },{threshold:0.08});
  document.querySelectorAll('.fade:not(.visible)').forEach(el=>obs.observe(el));
}

render();
</script>
